name: Tests

# Until this existed, nothing ran the suite automatically: the only workflow
# in this repository deployed the documentation.  627 Python tests and 13
# CTest entries executed solely when somebody remembered to, locally, against
# whatever happened to be configured in their build directory.  That is how
# the R testthat suite sat unreferenced by any add_test, how `ctest` reported
# "0 tests" while every test was registered, and how the whole
# @pytest.mark.integration tier skipped on every machine for months.
#
# Both jobs run ci/docker-tests -- the same command a developer runs locally
# -- so the toolchain, the Python packages, the MongoDB and the environment
# are defined once, in ci/Dockerfile, not here.  The image is built from the
# git-tracked files only, and CTest fixtures prepare the test database, so
# this file holds no setup steps at all.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------- #
  # The gate: C library + Python, no optional wrappers.  Keep this one
  # dependency-light so a failure here always means a real regression rather
  # than a missing toolchain.
  # ---------------------------------------------------------------------- #
  core:
    name: Core (dev preset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build, install and test in a clean container
        run: ci/docker-tests dev --results results

      - name: Upload the CTest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-dev
          path: results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------- #
  # Everything apt can provide: Fortran, Octave, R, the portal.  The `full`
  # preset skips any component whose toolchain is absent (Julia and MATLAB
  # here) with a warning rather than failing to configure.
  # ---------------------------------------------------------------------- #
  wrappers:
    name: Wrappers + portal (full preset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build, install and test in a clean container
        run: ci/docker-tests full --results results

      - name: Upload the CTest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-full
          path: results/
          if-no-files-found: ignore
