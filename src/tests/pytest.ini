# pytest configuration shared by src/tests/python/ and src/tests/interface-tests/.
#
# pytest searches upward from the paths it is given, so this applies whether
# the suite is started by ctest, from the repository root, or from either
# directory.
#
# Test tiers -- every test belongs to exactly one, chosen by what it needs:
#
#   (unmarked)  unit       source tree only; MongoDB is mocked or mongomock
#   installed              `cmake --install` has run: headers, libmodena,
#                          wrapper packages.  MongoDB still mongomock at most.
#   live                   a real MongoDB at MODENA_URI holding a fitted
#                          flowRate.  Only in interface-tests/: the conftest
#                          in python/ stubs out the database connection.
#
# The CTest labels unit / installed / live mirror these one-for-one.

[pytest]
addopts = --strict-markers
markers =
    installed: needs the installed MoDeNa tree (cmake --install), not a live database
    live: needs a live MongoDB at MODENA_URI with a fitted flowRate model
