# Fuller et al. diffusion coefficient — ForwardMappingModel
# D_AB = 1.011e-4 * T^1.75 * sqrt(1/W_A + 1/W_B) / (p * (V_A^(1/3) + V_B^(1/3))^2)
#
# Species pair: A = H2O, B = N2 (from the IndexSet definition in the module).
# bounds: effectively unbounded (wide physics-valid domain).
# parameters: [W[A], V[A], W[B], V[B]] — molecular weights and diffusion volumes.

[surrogate]

[surrogate.inputs.T]
min = 0.0
max = 9.0e99

[surrogate.inputs.p]
min = 0.0
max = 9.0e99

[surrogate.outputs.DA]
min = 0.0
max = 9.0e99

[surrogate.parameters.WA]
min = 0.0
max = 9.0e99

[surrogate.parameters.VA]
min = 0.0
max = 9.0e99

[surrogate.parameters.WB]
min = 0.0
max = 9.0e99

[surrogate.parameters.VB]
min = 0.0
max = 9.0e99

# Initial parameter values: W[H2O]=16, V[H2O]=9.44, W[N2]=14, V[N2]=11.38


# Fixed parameter values, keyed by the names declared above.  A bare
# `parameters = [...]` key here would be parsed into the preceding table,
# and positional lists are no longer accepted in any case.
[parameters]
WA = 16.0
VA = 9.44
WB = 14.0
VB = 11.38
