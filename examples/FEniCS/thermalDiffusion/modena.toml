# MoDeNa configuration for the FEniCS/thermalDiffusion example.
#
# The thermalDiffusion package is installed into ./models with:
#
#   modena install --prefix ./models ../../MoDeNaModels/thermalDiffusion/python
#
# (`pip install --target` would lay the package out flat, where the model
# registry -- which looks for <prefix>/lib/pythonX.Y/site-packages -- does
# not find it; and the path had one `../` too many.)

[models]
paths = ["./models"]

[surrogate_functions]
# Compiled surrogate .so files are placed alongside the models directory.
lib_dir = "./"
